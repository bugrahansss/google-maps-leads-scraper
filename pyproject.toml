[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "google-maps-leads-scraper"
version = "0.1.0"
description = "Export Google Maps businesses (name, phone, website, address, rating, hours, coordinates), place details and reviews to CSV with Python and the Scrape.do Google Maps API."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["google maps", "google maps scraper", "lead generation", "web scraping", "places", "reviews", "scrapedo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/bugrahansss/google-maps-leads-scraper"
Source = "https://github.com/bugrahansss/google-maps-leads-scraper"
Issues = "https://github.com/bugrahansss/google-maps-leads-scraper/issues"
Guide = "https://scrape.do/blog/google-maps-scraping/"

[project.scripts]
google-maps-leads-scraper = "google_maps_leads_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
